# analyst - product analytics / instrumentation quality. Model: Claude Opus 5.
# Only tool: the official PostHog remote MCP. No Sentry. No database.
# Shared base: keys verified against the Hermes docs (see docs/RESEARCH.md).
# Secrets are never here. They come from Railway Variables via ${HERMES_HOME}/.env
# and the process environment. ${VAR} in mcp_servers.*.headers resolves from both.

timezone: "Asia/Jerusalem"

terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180

compression:
  enabled: true
  threshold: 0.85

memory:
  memory_enabled: true
  user_profile_enabled: true

cron:
  wrap_response: false

model:
  provider: anthropic
  default: claude-opus-5

mcp_servers:
  posthog:
    url: "https://mcp.posthog.com/mcp"
    headers:
      Authorization: "Bearer ${POSTHOG_API_KEY}"
    enabled: true
    timeout: 120
