# eng - engineering triage. Model: Claude Opus 5.
# Shared base: keys verified against the Hermes docs (see docs/RESEARCH.md).
# Secrets are never here. They come from Railway Variables via ${HERMES_HOME}/.env
# and the process environment. ${VAR} in mcp_servers.*.headers resolves from both.

timezone: "Asia/Jerusalem"

terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180

compression:
  enabled: true
  threshold: 0.85

memory:
  memory_enabled: true
  user_profile_enabled: true

cron:
  wrap_response: false

model:
  provider: anthropic
  default: claude-opus-5

# Tools: Sentry, Linear, GitHub via remote (HTTP) MCP servers.
# Auth style per server is UNVERIFIED (see docs/UNVERIFIED.md #3). If a server
# rejects the bearer header, switch that entry to 'auth: oauth' and complete the
# login over Railway SSH: hermes mcp login <name>.
mcp_servers:
  sentry:
    url: "https://mcp.sentry.dev/mcp"
    headers:
      Authorization: "Bearer ${SENTRY_AUTH_TOKEN}"
    enabled: true
    timeout: 120
  linear:
    url: "https://mcp.linear.app/mcp"
    headers:
      Authorization: "Bearer ${LINEAR_API_KEY}"
    enabled: true
    timeout: 120
  github:
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
    enabled: true
    timeout: 120
