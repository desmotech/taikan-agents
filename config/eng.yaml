# eng - lead architect, software engineer, stability/on-call/performance.
# Shared base: keys verified against the Hermes docs (see docs/RESEARCH.md).
# Secrets are never here. They come from Railway Variables via ${HERMES_HOME}/.env
# and the process environment. ${VAR} in mcp_servers.*.headers resolves from both.

timezone: "Asia/Jerusalem"

terminal:
  backend: local
  cwd: /data/workspace
  timeout: 180

compression:
  enabled: true
  threshold: 0.85

memory:
  memory_enabled: true
  user_profile_enabled: true

cron:
  wrap_response: false

model:
  provider: anthropic
  default: claude-opus-5

# Slack uses SLACK_BOT_TOKEN + SLACK_APP_TOKEN from the environment, with
# SLACK_ALLOWED_USERS and SLACK_HOME_CHANNEL. See docs/ENG.md for activation.
# MCP configuration is not proof of a live connection. Test each integration.
# Railway OAuth credentials persist on the volume; no Railway CLI is required.
mcp_servers:
  sentry:
    url: "https://mcp.sentry.dev/mcp"
    headers:
      Authorization: "Bearer ${SENTRY_AUTH_TOKEN}"
    enabled: true
    timeout: 120
  linear:
    url: "https://mcp.linear.app/mcp"
    headers:
      Authorization: "Bearer ${LINEAR_API_KEY}"
    enabled: true
    timeout: 120
  github:
    url: "https://api.githubcopilot.com/mcp/"
    headers:
      Authorization: "Bearer ${GITHUB_TOKEN}"
    enabled: true
    timeout: 120
  posthog:
    url: "https://mcp.posthog.com/mcp?readonly=true"
    headers:
      Authorization: "Bearer ${POSTHOG_API_KEY}"
    enabled: true
    timeout: 120
  railway:
    url: "https://mcp.railway.com"
    auth: oauth
    enabled: true
    timeout: 120
